<script type="text/javascript">
    RED.nodes.registerType('matterjsController', {
        category: 'config',
        paletteLabel: 'matterjs controller',
        defaults: {
            name: { value: '' },
            url: { value: '${MATTER_WS_URL}', required: true },
            templatesDir: { value: '' },
            polls: { value: [] }
        },
        label: function () {
            return this.name || this.url || 'matterjs controller';
        },
        oneditprepare: function () {
            $('#node-config-input-polls-list').editableList({
                addItem: function (container, i, opt) {
                    var row = opt || {};
                    container.css({
                        overflow: 'hidden', whiteSpace: 'nowrap',
                        display: 'flex', alignItems: 'center', gap: '4px'
                    });
                    var cluster = $('<input/>', { type: 'number', placeholder: 'cluster (e.g. 513)', style: 'flex:1;min-width:80px;' })
                        .val(row.cluster || '').appendTo(container);
                    var attribute = $('<input/>', { type: 'number', placeholder: 'attr (e.g. 17)', style: 'flex:1;min-width:60px;' })
                        .val(row.attribute || '').appendTo(container);
                    var interval = $('<input/>', { type: 'number', placeholder: 'interval s', style: 'width:80px;' })
                        .val(row.intervalSeconds || 60).appendTo(container);
                    var scope = $('<input/>', { type: 'text', placeholder: 'nodeId (blank=all)', style: 'width:120px;' })
                        .val(row.scopeFilter || '').appendTo(container);
                },
                removable: true,
                sortable: false
            });
            for (var i = 0; i < (this.polls || []).length; i++) {
                $('#node-config-input-polls-list').editableList('addItem', this.polls[i]);
            }
        },
        oneditsave: function () {
            var polls = [];
            $('#node-config-input-polls-list').editableList('items').each(function () {
                var inputs = $(this).find('input');
                if (inputs.length >= 4) {
                    polls.push({
                        cluster: $(inputs[0]).val(),
                        attribute: $(inputs[1]).val(),
                        intervalSeconds: $(inputs[2]).val(),
                        scopeFilter: $(inputs[3]).val()
                    });
                }
            });
            this.polls = polls;
        }
    });
</script>

<script type="text/javascript">
// Editor sidebar: a live device table per matterjs controller (node_id, model, IPv6, fw, online).
// Pulls from the controller's /matterjs-bridge/:id/inventory admin endpoint.
(function () {
    function buildSidebar() {
        try {
            if (!RED.sidebar || typeof RED.sidebar.addTab !== 'function') return;
            if ($('#matterjs-devices-content').length) return;

            var content = $('<div>', { id: 'matterjs-devices-content', style: 'padding:8px; font-size:13px; height:100%; box-sizing:border-box; display:flex; flex-direction:column;' });
            var bar = $('<div>', { style: 'display:flex; gap:6px; align-items:center; margin-bottom:8px; flex:0 0 auto;' }).appendTo(content);
            var sel = $('<select>', { id: 'matterjs-devices-controller', style: 'flex:1; min-width:0;' }).appendTo(bar);
            var refresh = $('<button>', { class: 'red-ui-button red-ui-button-small', title: 'Refresh' })
                .html('<i class="fa fa-refresh"></i>').appendTo(bar);
            var net = $('<label>', { style: 'white-space:nowrap; font-size:11px; color:#888;' });
            $('<input>', { type: 'checkbox', id: 'matterjs-devices-readnet', style: 'vertical-align:middle;' }).appendTo(net);
            net.append(' read IPv6').appendTo(bar);
            $('<div>', { id: 'matterjs-devices-table', style: 'flex:1 1 auto; overflow:auto; min-height:0;' }).appendTo(content);

            function populateControllers() {
                var prev = sel.val();
                sel.empty();
                var count = 0;
                RED.nodes.eachConfig(function (cfg) {
                    if (cfg.type === 'matterjsController') {
                        count++;
                        sel.append($('<option>', { value: cfg.id, text: cfg.name || cfg.url || cfg.id }));
                    }
                });
                if (!count) sel.append($('<option>', { value: '', text: '(no matterjs controllers)' }));
                if (prev) sel.val(prev);
            }

            function render(rows) {
                var t = $('<table>', { style: 'width:100%; border-collapse:collapse;' });
                var head = $('<tr>').appendTo($('<thead>').appendTo(t));
                ['id', 'Model', 'Net', 'IPv6', 'fw', ''].forEach(function (h) {
                    $('<th>', { text: h, style: 'text-align:left; border-bottom:1px solid #ccc; padding:2px 4px; color:#888; font-weight:normal; position:sticky; top:0; background:var(--red-ui-secondary-background, #fff); z-index:1;' }).appendTo(head);
                });
                rows.forEach(function (r) {
                    var model = [r.vendor, r.product].filter(Boolean).join(' ');
                    if (r.part_number) model += ' (' + r.part_number + ')';
                    var tr = $('<tr>').appendTo(t);
                    $('<td>', { text: r.node_id, style: 'padding:2px 4px; font-family:monospace;' }).appendTo(tr);
                    $('<td>', { text: model, style: 'padding:2px 4px;' }).appendTo(tr);
                    $('<td>', { text: r.transport || '', style: 'padding:2px 4px; font-size:11px; color:#666;' }).appendTo(tr);
                    $('<td>', { text: (r.ipv6 || []).join(', '), style: 'padding:2px 4px; font-family:monospace; font-size:11px; word-break:break-all;' }).appendTo(tr);
                    $('<td>', { text: r.firmware || '', style: 'padding:2px 4px; font-size:11px;' }).appendTo(tr);
                    $('<td>', { html: r.available ? '<span style="color:#5a5">&#9679;</span>' : '<span style="color:#c55">&#9679;</span>', style: 'padding:2px 4px; text-align:center;' }).appendTo(tr);
                });
                $('#matterjs-devices-table').empty().append(t);
            }

            function load() {
                var id = sel.val();
                if (!id) { $('#matterjs-devices-table').html('<div style="color:#888;">No controller selected.</div>'); return; }
                var url = 'matterjs-bridge/' + id + '/inventory' + ($('#matterjs-devices-readnet').is(':checked') ? '?readNetwork=true' : '');
                $('#matterjs-devices-table').html('<div style="color:#888;">Loading…</div>');
                $.getJSON(url).done(function (rows) {
                    if (!Array.isArray(rows) || !rows.length) { $('#matterjs-devices-table').html('<div style="color:#888;">No devices.</div>'); return; }
                    render(rows);
                }).fail(function (xhr) {
                    var err = (xhr.responseJSON && xhr.responseJSON.error) || xhr.status;
                    $('#matterjs-devices-table').html('<div style="color:#c55;">Error: ' + err + '</div>');
                });
            }

            refresh.on('click', load);
            sel.on('change', load);

            RED.sidebar.addTab({
                id: 'matterjs-devices',
                label: 'matter',
                name: 'Matter Devices',
                iconClass: 'fa fa-sitemap',
                content: content[0],
                closeable: true,
                visible: false,
                onchange: function () { populateControllers(); load(); }
            });
            populateControllers();
        } catch (e) { /* sidebar is best-effort; never break the editor */ }
    }
    if (typeof RED !== 'undefined' && RED.sidebar) { buildSidebar(); }
})();
</script>

<script type="text/html" data-template-name="matterjsController">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="matterjs (Home)">
    </div>
    <div class="form-row">
        <label for="node-config-input-url"><i class="fa fa-globe"></i> WS URL</label>
        <input type="text" id="node-config-input-url" placeholder="ws://matter.caddy:5580/ws">
    </div>
    <div class="form-tips">
        URL supports env substitution: <code>${MATTER_WS_URL}</code> (or inline, e.g. <code>ws://${MATTER_HOST}:5580/ws</code>) is resolved from process.env at startup.
    </div>
    <div class="form-row">
        <label for="node-config-input-templatesDir"><i class="fa fa-folder-open"></i> Templates dir</label>
        <input type="text" id="node-config-input-templatesDir" placeholder="(blank = bundled only)">
    </div>
    <div class="form-tips">
        Optional path to a directory containing custom template JSON files. Overrides bundled templates on id collision.
    </div>
    <div class="form-row">
        <label><i class="fa fa-repeat"></i> Auto-poll</label>
    </div>
    <div class="form-row">
        <ol id="node-config-input-polls-list"></ol>
    </div>
    <div class="form-tips">
        Periodically poll a (cluster, attribute) pair — useful for devices that don't spontaneously push updates.
        Common settings: cluster 513 attr 17 (thermostat setpoint) at 60s, or cluster 144 attr 8 (power) at 30s.
        Leave scopeFilter blank to apply to all nodes; otherwise it matches a specific Matter nodeId.
    </div>
</script>

<script type="text/html" data-help-name="matterjsController">
    <p>Config node for the WebSocket connection to a matterjs-server instance.</p>
    <p>Creates a shared <code>MatterClient</code> (via <code>@matter-server/ws-client</code>) that all
    matterjs in/out/discover nodes share. Handles reconnect automatically and maintains the node cache.</p>
</script>
