<script type="text/javascript">
    RED.nodes.registerType('matterjsIn', {
        category: 'Home Automation',
        color: '#a6d8e8',
        paletteLabel: 'matterjs in',
        defaults: {
            name: { value: '' },
            controller: { value: '', type: 'matterjsController', required: true },
            format: { value: 'hal2' },
            topicFilter: { value: '' },
            nodeIdFilter: { value: '' },
            errorOutput: { value: false },
            emitMeta: { value: false }
        },
        inputs: 0,
        outputs: 1,
        outputLabels: function (i) {
            if (this.errorOutput) return i === 0 ? 'events' : 'errors';
            return 'events';
        },
        icon: 'inject.svg',
        label: function () {
            return this.name || 'matterjs in';
        },
        oneditprepare: function () {
            $('#node-input-errorOutput').on('change', function () {
                $('#node-input-errorOutput-hint').text(this.checked
                    ? 'Outputs: 1=events, 2=errors'
                    : 'Single output: events only');
            }).trigger('change');
        },
        oneditsave: function () {
            this.outputs = this.errorOutput ? 2 : 1;
        }
    });
</script>

<script type="text/html" data-template-name="matterjsIn">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-controller"><i class="fa fa-globe"></i> Controller</label>
        <input type="text" id="node-input-controller">
    </div>
    <div class="form-row">
        <label for="node-input-format"><i class="fa fa-cog"></i> Format</label>
        <select id="node-input-format">
            <option value="hal2">hal2 (topic + payload + msg.matter)</option>
            <option value="raw">raw (unformatted event data)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-topicFilter"><i class="fa fa-filter"></i> Topic filter</label>
        <input type="text" id="node-input-topicFilter" placeholder="matter/42/# (blank = all)">
    </div>
    <div class="form-row">
        <label for="node-input-nodeIdFilter"><i class="fa fa-filter"></i> Matter node id</label>
        <input type="text" id="node-input-nodeIdFilter" placeholder="(blank = all)">
    </div>
    <div class="form-row">
        <label for="node-input-errorOutput"><i class="fa fa-exclamation-triangle"></i> Error output</label>
        <input type="checkbox" id="node-input-errorOutput" style="display:inline-block; width:auto; vertical-align:top;">
        <span id="node-input-errorOutput-hint" style="margin-left:8px; color:#999;"></span>
    </div>
    <div class="form-row">
        <label for="node-input-emitMeta"><i class="fa fa-info-circle"></i> Emit metadata</label>
        <input type="checkbox" id="node-input-emitMeta" style="display:inline-block; width:auto; vertical-align:top;">
        <span style="margin-left:8px; color:#999;">Publish <code>matter/&lt;id&gt;/_meta</code> (model, ipv6, serial …)</span>
    </div>
</script>

<script type="text/html" data-help-name="matterjsIn">
    <p>Emits attribute updates and node events from matterjs-server as Node-RED messages.</p>
    <p><b>hal2 format</b>: <code>msg.topic = matter/{nodeId}/{ep}/{cluster}/{attr}</code>,
    <code>msg.payload = new value</code>, <code>msg.matter = {nodeId, endpoint, cluster, attribute, kind}</code>.</p>
    <p>Topic filter supports MQTT wildcards: <code>+</code> (one level) and <code>#</code> (remainder).</p>
    <p>Matter node id filters on the Matter device id (assigned by matterjs-server at commissioning),
    not Node-RED's internal node id.</p>

    <h4>Error output (optional)</h4>
    <p>matterjsIn has no triggering input message, so catch-nodes can't be used to handle controller-side
    errors (connection lost, malformed WS payload, etc.). Enable <b>Error output</b> to add a second output
    that receives error msgs:</p>
    <pre>msg.topic = "matter/_error"
msg.payload = { type, source, message, ts }</pre>
    <p>Common <code>type</code> values: <code>disconnected</code>, <code>bridge_error</code>,
    <code>bridge_create_failed</code>, <code>start_listening_failed</code>. The same errors are also visible
    via the controller's status (e.g. yellow ring "disconnected" / "reconnect in 4s").</p>

    <h4>Emit metadata (optional)</h4>
    <p>When enabled, publishes one message per node on the reserved hal2 topic
    <code>matter/&lt;id&gt;/_meta</code> with an object payload <code>{ source: "matter", transport, model,
    vendor, product, part_number, serial, firmware, hardware, ipv6, ipv4 }</code>, on (re)connect and whenever
    nodes change. <code>source</code> marks the device as Matter-originated and <code>transport</code> is
    <code>thread</code>/<code>wifi</code>/<code>ethernet</code>. hal2 Things
    store this generically as read-only <b>metadata</b> (visible in the Thing editor and via the hal2 MCP
    <code>get_all_states</code>). hal2 <i>merges</i> the object into the Thing's metadata; empty fields are
    sent as <code>null</code> so stale keys are pruned. Enable this on exactly one matterjs-in that feeds
    your hal2 Things to avoid duplicate emissions.</p>
</script>
